    - mkdir -p ${TARGET}/debug
    - cd ${TARGET}/debug
    - cmake -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=../../toolchains/Dreamcast.cmake -DSIMULANT_BUILD_SAMPLES=OFF -DSIMULANT_BUILD_C_BINDINGS=ON ../..
