build:dreamcast-sh4-gcc:
  stage: build
  image: kazade/dreamcast-sdk
  variables:
    TARGET: dreamcast-sh4-gcc
  before_script:
    # valac builds ports/vala; meson+ninja build deps/glib. Installed here as
    # well as in platforms/dreamcast/Dockerfile, since CI pulls the published
    # image. glib 2.90 needs meson >= 1.4.0 and Fedora 37 only ships 1.0.1,
    # so meson comes from pip.
    - dnf install -y vala ninja-build python3-pip || true
