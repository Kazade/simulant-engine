include:
  - template: Jobs/Dependency-Scanning.latest.gitlab-ci.yml
  - template: Jobs/SAST.latest.gitlab-ci.yml
  - template: Jobs/Code-Quality.gitlab-ci.yml
  - template: Jobs/Secret-Detection.latest.gitlab-ci.yml

code_quality:
  artifacts:
    paths: [gl-code-quality-report.json]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH"
    - if: '$CI_COMMIT_REF_NAME == "next"'
    - if: '$CI_COMMIT_REF_NAME == "legacy"'
    - if: "$CI_COMMIT_TAG"

stages:
  - prepare
  - build
  - test
  - deploy

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  SAST_EXCLUDED_PATHS: spec, test, tests, tmp, simulant/deps

pages:
  stage: prepare
  image: fedora:33
  script:
    - dnf install -y doxygen python3 git
    - python3 tools/gendocs.py `pwd` `git describe --abbrev=4 --always --tags | cut -d - -f 1-2` `pwd`
    - mv `git describe --abbrev=4 --always --tags | cut -d - -f 1-2`/html public
  artifacts:
    paths:
      - public
  only:
    - main
    - next

prepare:linux-x64-gcc11:
  stage: prepare
  image: docker:latest
  services:
    - docker:dind
  variables:
    GIT_STRATEGY: none # Prevent cloning
    DOCKERFILE: >- # Generate a Dockerfile for the build image
      FROM fedora:33\n
      RUN dnf update -y && dnf clean all\n
      RUN dnf install -y cmake make gcc-c++ python SDL2-devel openal-soft-devel zlib-devel mesa-libGL-devel SDL2 openal-soft mesa-libGL libstdc++ pulseaudio pulseaudio-utils xorg-x11-server-Xvfb xorg-x11-drv-dummy dpkg mesa-dri-drivers vala ninja-build python3-pip\n
      # deps/glib (glib 2.90) needs meson >= 1.4.0; Fedora 33 ships 0.59.\n
      RUN pip3 install --upgrade meson\n
  before_script: # Put the variable into a Dockerfile
    - echo -e $DOCKERFILE > Dockerfile
    - cat Dockerfile
  script:
    - docker pull $CI_REGISTRY_IMAGE:linux-x64-gcc11 || true
    - docker build --cache-from $CI_REGISTRY_IMAGE:linux-x64-gcc11 -t $CI_REGISTRY_IMAGE:linux-x64-gcc11 .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:linux-x64-gcc11
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
    - if: "$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH"
      changes:
        - .gitlab-ci.yml

prepare:windows-x64-mingw:
  stage: prepare
  image: docker:latest
  services:
    - docker:dind
  before_script: # Put the variable into a Dockerfile
    - cp platforms/windows/Dockerfile Dockerfile
  script:
    - docker pull $CI_REGISTRY_IMAGE:windows-x64-mingw || true
    - docker build --cache-from $CI_REGISTRY_IMAGE:windows-x64-mingw -t $CI_REGISTRY_IMAGE:windows-x64-mingw .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:windows-x64-mingw
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - platforms/windows/Dockerfile
    - if: "$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH"
      changes:
        - platforms/windows/Dockerfile

prepare:deploy:
  stage: prepare
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKERFILE: >- # Generate a Dockerfile for the build image
      FROM fedora:33\n
      RUN dnf -y install openssl-devel python-devel python-setuptools libffi-devel python-pip rsync zip\n
      RUN pip install gsutil\n
  before_script: # Put the variable into a Dockerfile
    - echo -e $DOCKERFILE > Dockerfile
    - cat Dockerfile
  script:
    - docker pull $CI_REGISTRY_IMAGE:deploy || true
    - docker build --cache-from $CI_REGISTRY_IMAGE:deploy -t $CI_REGISTRY_IMAGE:deploy .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
    - if: "$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH"
      changes:
        - .gitlab-ci.yml

.build:android:
  stage: build
  image: kazade/android-sdk
  cache:
    key:
      files:
        - gradle/gradle/wrapper/gradle-wrapper.properties
    paths:
      - gradle/.gradle/caches/
      - gradle/.gradle/notifications/
      - gradle/.gradle/wrapper/
  before_script:
    # valac builds ports/vala; meson+ninja build deps/glib (Fedora 43's meson
    # is 1.8.5, new enough for glib 2.90's `meson_version >= 1.4.0`).
    # Installed here as well as in platforms/android/Dockerfile, since CI
    # pulls the published image.
    - dnf install -y vala meson ninja-build || true
  script:
    - cd gradle
    - export ABI_FILTERS=${ABI}
    - ./gradlew --parallel --build-cache --gradle-user-home .gradle/ ${BUILD_JOB}
    - cd ..
    - mkdir -p ${TARGET}/${BUILD_TYPE}/simulant
    - mv gradle/simulant/build/outputs/aar/simulant-${BUILD_TYPE}.aar ${TARGET}/${BUILD_TYPE}/simulant/simulant-${BUILD_TYPE}.aar
    # - mkdir -p ${TARGET}/${BUILD_TYPE}/tests
    # - mv gradle/tests/build/outputs/apk/${BUILD_TYPE}/* ${TARGET}/${BUILD_TYPE}/tests
    # The .aar is a Java-consumption format and carries none of these, so the
    # static libraries a C/Vala consumer has to link are collected separately,
    # one directory per ABI (AGP builds each ABI in its own CMake tree). Found
    # by name rather than by a hardcoded .cxx/ layout, which AGP has changed
    # between versions.
    - |
      for abi in $(echo "${ABI}" | tr ';' ' '); do
        mkdir -p ${TARGET}/${BUILD_TYPE}/abi/${abi}
        find gradle/simulant -path "*/${abi}/*" \
          \( -name 'libsimulant-c.a' -o -name 'libsimulant-vala.a' \
             -o -name 'libglib-2.0.a' -o -name 'libgobject-2.0.a' \
             -o -name 'libpcre2-8.a' -o -name 'libffi.a' -o -name 'libintl.a' \) \
          -exec cp {} ${TARGET}/${BUILD_TYPE}/abi/${abi}/ \;
      done
    # valac's generated .vapi/.h describe the same API for every ABI, so one
    # copy is enough -- placed in the layout the other platforms build
    # directly, so .deploy:deploy needs no Android-specific handling.
    - mkdir -p ${TARGET}/${BUILD_TYPE}/ports/vala
    - find gradle/simulant \( -name 'simulant-vala.vapi' -o -name 'simulant-vala.h' \) -exec cp {} ${TARGET}/${BUILD_TYPE}/ports/vala/ \;
  artifacts:
    paths:
      - ${TARGET}/${BUILD_TYPE}/simulant/
      - ${TARGET}/${BUILD_TYPE}/tests/
      - ${TARGET}/${BUILD_TYPE}/abi/
      - ${TARGET}/${BUILD_TYPE}/ports/vala/

build:android-all-clang:release:
  extends: .build:android
  variables:
    ABI: x86_64;armeabi-v7a;arm64-v8a
    TARGET: android-all-clang
    BUILD_TYPE: release
    BUILD_JOB: assembleRelease

build:android-all-clang:debug:
  extends: .build:android
  variables:
    ABI: x86_64;armeabi-v7a;arm64-v8a
    TARGET: android-all-clang
    BUILD_TYPE: debug
    BUILD_JOB: assembleDebug

build:psp-mips-gcc:debug:
  stage: build
  image: kazade/psp-sdk
  variables:
    TARGET: psp-mips-gcc
  before_script:
    # meson+ninja build deps/glib, valac builds ports/vala. Installed here as
    # well as in platforms/psp/Dockerfile, since CI pulls the published image.
    - apk add --no-cache vala meson ninja || true
  script:
    - mkdir -p ${TARGET}/debug
    - cd ${TARGET}/debug
    - psp-cmake -DCMAKE_BUILD_TYPE=Debug -DSIMULANT_BUILD_SAMPLES=OFF -DSIMULANT_BUILD_C_BINDINGS=ON ../..
    - make -j3
  artifacts:
    paths:
      - ${TARGET}/debug/simulant/
      - ${TARGET}/debug/ports/
      - ${TARGET}/debug/assets/
      - ${TARGET}/debug/tests/EBOOT.PBP
      # Vendored glib/gobject (+ its pcre2/libffi/proxy-libintl subproject
      # deps) that libsimulant-vala.a's PUBLIC link interface requires --
      # see cmake/BuildGLib.cmake. Best-effort: only present if valac was
      # found above and simulant-vala actually built.
      - ${TARGET}/debug/deps/glib-build/glib/*.a
      - ${TARGET}/debug/deps/glib-build/glib/*.h
      - ${TARGET}/debug/deps/glib-build/gobject/*.a
      - ${TARGET}/debug/deps/glib-build/gobject/*.h
      - ${TARGET}/debug/deps/glib-build/subprojects/pcre2-*/libpcre2-8.a
      - ${TARGET}/debug/deps/glib-build/subprojects/libffi-*/src/libffi.a
      - ${TARGET}/debug/deps/glib-build/subprojects/proxy-libintl-*/libintl.a

build:psp-mips-gcc:release:
  stage: build
  image: kazade/psp-sdk
  variables:
    TARGET: psp-mips-gcc
  before_script:
    # meson+ninja build deps/glib, valac builds ports/vala. Installed here as
    # well as in platforms/psp/Dockerfile, since CI pulls the published image.
    - apk add --no-cache vala meson ninja || true
  script:
    - mkdir -p ${TARGET}/release
    - cd ${TARGET}/release
    - psp-cmake -DCMAKE_BUILD_TYPE=Release -DSIMULANT_BUILD_SAMPLES=OFF -DSIMULANT_BUILD_C_BINDINGS=ON ../..
    - make -j3
  artifacts:
    paths:
      - ${TARGET}/release/simulant/
      - ${TARGET}/release/ports/
      - ${TARGET}/release/assets/
      - ${TARGET}/release/tests/EBOOT.PBP
      - ${TARGET}/release/deps/glib-build/glib/*.a
      - ${TARGET}/release/deps/glib-build/glib/*.h
      - ${TARGET}/release/deps/glib-build/gobject/*.a
      - ${TARGET}/release/deps/glib-build/gobject/*.h
      - ${TARGET}/release/deps/glib-build/subprojects/pcre2-*/libpcre2-8.a
      - ${TARGET}/release/deps/glib-build/subprojects/libffi-*/src/libffi.a
      - ${TARGET}/release/deps/glib-build/subprojects/proxy-libintl-*/libintl.a

test:psp-mips-gcc:
  stage: test
  image: fedora:33
  variables:
    TARGET: psp-mips-gcc
  needs: ["build:psp-mips-gcc:debug", "build:psp-mips-gcc:release"]
  dependencies:
    - build:psp-mips-gcc:debug
    - build:psp-mips-gcc:release
  before_script:
    - dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm
    - dnf install -y dpkg ppsspp-sdl pulseaudio pulseaudio-utils xorg-x11-server-Xvfb xorg-x11-drv-dummy mesa-dri-drivers
    - start-stop-daemon --start --quiet --pidfile /tmp/custom_xvfb_99.pid --make-pidfile --background --exec /usr/bin/Xvfb -- :99 -screen 0 320x240x24 -ac +extension RANDR +extension GLX +render
    - sleep 3
    - export LIBGL_ALWAYS_SOFTWARE=1
    - export DISPLAY=:99
  script:
    - mkdir -p /root/.config/ppsspp/PSP/SYSTEM/
    - cd ${TARGET}/debug
    - export SIMULANT_SOUND_DRIVER=null
    - ln -s ../simulant simulant
    - ln -s ../assets assets
    - cp tests/EBOOT.PBP .
    # FIXME: PSP tests currently hang on future tests, we need to fix that!
    - timeout 120s PPSSPPSDL -d --escape-exit EBOOT.PBP || true
  artifacts:
    when: always
    reports:
      junit: ${TARGET}/debug/report.xml
    paths:
      - ${TARGET}/debug/simulant/libsimulant.a
      - ${TARGET}/release/simulant/libsimulant.a
      - ${TARGET}/debug/ports/
      - ${TARGET}/release/ports/
      - ${TARGET}/debug/deps/glib-build/glib/*.a
      - ${TARGET}/debug/deps/glib-build/glib/*.h
      - ${TARGET}/debug/deps/glib-build/gobject/*.a
      - ${TARGET}/debug/deps/glib-build/gobject/*.h
      - ${TARGET}/debug/deps/glib-build/subprojects/pcre2-*/libpcre2-8.a
      - ${TARGET}/debug/deps/glib-build/subprojects/libffi-*/src/libffi.a
      - ${TARGET}/debug/deps/glib-build/subprojects/proxy-libintl-*/libintl.a
      - ${TARGET}/release/deps/glib-build/glib/*.a
      - ${TARGET}/release/deps/glib-build/glib/*.h
      - ${TARGET}/release/deps/glib-build/gobject/*.a
      - ${TARGET}/release/deps/glib-build/gobject/*.h
      - ${TARGET}/release/deps/glib-build/subprojects/pcre2-*/libpcre2-8.a
      - ${TARGET}/release/deps/glib-build/subprojects/libffi-*/src/libffi.a
      - ${TARGET}/release/deps/glib-build/subprojects/proxy-libintl-*/libintl.a

build:windows-x64-vcxx:release:
  stage: build
  allow_failure: true
  tags:
    - saas-windows-medium-amd64
  variables:
    TARGET: windows-x64-vcxx
    MSBUILD: 'C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\MSBuild\Current\Bin\MSBuild.exe'
  before_script:
    - choco install -y cmake
    - $env:Path += ';C:\Program Files\CMake\bin'
  script:
    - mkdir -p ${TARGET}/release
    - cd ${TARGET}/release
    - cmake -G "Visual Studio 14 2015 Win64" -DCMAKE_BUILD_TYPE=Release -DSIMULANT_BUILD_SAMPLES=OFF ../..
    - dir
    - '& "$MSBUILD" my.vcxproj'
  artifacts:
    paths:
      - ${TARGET}/release/simulant/*.dll

build:windows-x64-mingw:release:
  stage: build
  image: $CI_REGISTRY_IMAGE:windows-x64-mingw
  variables:
    MINGW_BIN_DIR: /usr/x86_64-w64-mingw32/sys-root/mingw/bin/
    TARGET: windows-x64-mingw
  script:
    - mkdir -p ${TARGET}/release
    - cd ${TARGET}/release
    - sleep 5 && set -m && mingw64-cmake -DCMAKE_BUILD_TYPE=Release -DSIMULANT_BUILD_SAMPLES=OFF -DSIMULANT_BUILD_C_BINDINGS=ON ../..
    - make -j3
    - cp $MINGW_BIN_DIR/zlib1.dll simulant/
    - cp $MINGW_BIN_DIR/SDL2.dll simulant/
    - cp $MINGW_BIN_DIR/libgcc_s_seh-1.dll simulant/
    - cp $MINGW_BIN_DIR/libstdc++-6.dll simulant/
    - cp $MINGW_BIN_DIR/libwinpthread-1.dll simulant/
    - cp $MINGW_BIN_DIR/OpenAL32.dll simulant/
    - cp $MINGW_BIN_DIR/libssp-0.dll simulant/
  artifacts:
    paths:
      - ${TARGET}/release/simulant/*.dll
      - ${TARGET}/release/ports/
      - ${TARGET}/release/deps/glib-build/glib/*.a
      - ${TARGET}/release/deps/glib-build/glib/*.h
      - ${TARGET}/release/deps/glib-build/gobject/*.a
      - ${TARGET}/release/deps/glib-build/gobject/*.h
      - ${TARGET}/release/deps/glib-build/subprojects/pcre2-*/libpcre2-8.a
      - ${TARGET}/release/deps/glib-build/subprojects/libffi-*/src/libffi.a
      # Windows forces the static proxy-libintl fallback rather than
      # linking Fedora's mingw64-gettext import library, which would make
      # consumers need libintl-8.dll -- see cmake/BuildGLib.cmake.
      - ${TARGET}/release/deps/glib-build/subprojects/proxy-libintl-*/libintl.a

build:windows-x64-mingw:debug:
  stage: build
  image: $CI_REGISTRY_IMAGE:windows-x64-mingw
  variables:
    MINGW_BIN_DIR: /usr/x86_64-w64-mingw32/sys-root/mingw/bin/
    TARGET: windows-x64-mingw
  script:
    - mkdir -p ${TARGET}/debug
    - cd ${TARGET}/debug
    - sleep 5 && set -m && mingw64-cmake -DCMAKE_BUILD_TYPE=Debug -DSIMULANT_BUILD_SAMPLES=OFF -DSIMULANT_BUILD_C_BINDINGS=ON ../..
    - make -j3
    - cp $MINGW_BIN_DIR/zlib1.dll simulant/
    - cp $MINGW_BIN_DIR/SDL2.dll simulant/
    - cp $MINGW_BIN_DIR/libgcc_s_seh-1.dll simulant/
    - cp $MINGW_BIN_DIR/libstdc++-6.dll simulant/
    - cp $MINGW_BIN_DIR/libwinpthread-1.dll simulant/
    - cp $MINGW_BIN_DIR/OpenAL32.dll simulant/
    - cp $MINGW_BIN_DIR/libssp-0.dll simulant/
    - cp simulant/*.dll tests/
    # Windows test runners need software OpenGL to work
    - cp ../../platforms/windows/mesa/*.dll tests/
  artifacts:
    paths:
      - ${TARGET}/debug/simulant/
      - ${TARGET}/debug/ports/
      - ${TARGET}/debug/assets/
      - ${TARGET}/debug/tests/simulant_tests.exe
      - ${TARGET}/debug/tests/*.*
      - ${TARGET}/debug/tests/*.dll
      - ${TARGET}/debug/deps/glib-build/glib/*.a
      - ${TARGET}/debug/deps/glib-build/glib/*.h
      - ${TARGET}/debug/deps/glib-build/gobject/*.a
      - ${TARGET}/debug/deps/glib-build/gobject/*.h
      - ${TARGET}/debug/deps/glib-build/subprojects/pcre2-*/libpcre2-8.a
      - ${TARGET}/debug/deps/glib-build/subprojects/libffi-*/src/libffi.a
      - ${TARGET}/debug/deps/glib-build/subprojects/proxy-libintl-*/libintl.a

test:windows-x64-mingw:
  stage: test
  timeout: 300 seconds
  allow_failure: true
  image: $CI_REGISTRY_IMAGE:windows-x64-mingw
  needs: ["build:windows-x64-mingw:debug", "build:windows-x64-mingw:release"]
  dependencies:
    - build:windows-x64-mingw:debug
    - build:windows-x64-mingw:release
  variables:
    TARGET: windows-x64-mingw
    GIT_STRATEGY: none # Prevent cloning
    # Force SDL2 to use dummy drivers so it doesn't try to create a real
    # window or open audio devices under Wine.
    SDL_VIDEODRIVER: offscreen
    SDL_AUDIODRIVER: dummy
  before_script:
    - sudo dnf install -y xorg-x11-server-Xvfb xorg-x11-drv-dummy dpkg mesa-dri-drivers wine
    - start-stop-daemon --start --quiet --pidfile /tmp/custom_xvfb_99.pid --make-pidfile --background --exec /usr/bin/Xvfb -- :99 -screen 0 320x240x24 -ac +extension RANDR +extension GLX +render
    - sleep 3
    - export LIBGL_ALWAYS_SOFTWARE=1
    - export SIMULANT_SOUND_DRIVER=null
    - export DISPLAY=:99
    - export GALLIUM_DRIVER=softpipe
    # Pre-initialise Wine non-interactively so it doesn't hang on first run.
    - wineboot --init
  script:
    - cd ${TARGET}/debug/tests
    - ln -s ../simulant
    - ln -s ../assets
    - export WINEDEBUG=err+all,+loaddll
    - wine simulant_tests.exe --junit-xml=report.xml
  artifacts:
    when: always
    reports:
      junit: ${TARGET}/debug/tests/report.xml
    paths:
      - ${TARGET}/debug/simulant/*.dll
      - ${TARGET}/release/simulant/*.dll

