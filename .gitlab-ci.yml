## clang build is currently just for checking compilation
build:linux-x64-clang:
  stage: build
  image: fedora:38
  variables:
    TARGET: linux-x64-clang
  before_script:
    - dnf install -y dnf && dnf clean all
    - dnf install -y cmake make clang python SDL2-devel openal-soft-devel zlib-devel mesa-libGL-devel
  script:
    - export CC=/usr/bin/clang
    - export CXX=/usr/bin/clang++
    - mkdir -p ${TARGET}/debug
    - cd ${TARGET}/debug
    - cmake -DCMAKE_BUILD_TYPE=Debug -DSIMULANT_BUILD_SAMPLES=OFF ../..
    - make -j3
    - cd ../..
    - mkdir -p ${TARGET}/release
    - cd ${TARGET}/release
    - cmake -DCMAKE_BUILD_TYPE=Release -DSIMULANT_BUILD_SAMPLES=OFF ../..
    - make -j3
  artifacts:
    paths:
      - ${TARGET}/debug/simulant/
      - ${TARGET}/debug/assets/
      - ${TARGET}/debug/tests/simulant_tests
      - ${TARGET}/debug/tests/*.*
      - ${TARGET}/release/simulant/

build:evercade-armv7-gcc:
  stage: build
  image: kazade/evercade-sdk
  variables:
    TARGET: evercade-armv7-gcc
  # Note: valac is deliberately not installed here. cmake/BuildGLib.cmake's
  # cross-compile handling only special-cases PLATFORM_PSP/PLATFORM_DREAMCAST;
  # its else() branch assumes a native host build, so enabling valac (and
  # therefore simulant-vala, which pulls in a from-source glib build) here
  # would try to configure glib's Meson build as if compiling natively with
  # this toolchain's cross-compiler, which isn't supported and would likely
  # break the whole job. simulant-c (no glib dependency) still builds fine.
  script:
    - mkdir -p ${TARGET}/debug
    - cd ${TARGET}/debug
    - cmake -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=../../toolchains/Evercade.cmake -DSIMULANT_BUILD_SAMPLES=OFF -DSIMULANT_BUILD_C_BINDINGS=ON ../..
    - make -j3
    - cd ../..
    - mkdir -p ${TARGET}/release
    - cd ${TARGET}/release
    - cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=../../toolchains/Evercade.cmake -DSIMULANT_BUILD_SAMPLES=OFF -DSIMULANT_BUILD_C_BINDINGS=ON ../..
    - make -j3
  artifacts:
    paths:
      - ${TARGET}/debug/simulant/
      - ${TARGET}/debug/ports/
      - ${TARGET}/debug/assets/
      - ${TARGET}/debug/tests/simulant_tests
      - ${TARGET}/debug/tests/*.*
      - ${TARGET}/release/simulant/
      - ${TARGET}/release/ports/
      - ${TARGET}/release/assets/
      - ${TARGET}/release/tests/simulant_tests

build:raspberrypi-armv7-gcc:
  stage: build
  image: kazade/raspberrypi-sdk
  variables:
    TARGET: raspberrypi-armv7-gcc
  # Note: valac deliberately not installed -- see the same note on
  # build:evercade-armv7-gcc above; cmake/BuildGLib.cmake has no cross-file
  # support for this toolchain, so simulant-vala can't build here yet.
  script:
    - mkdir -p ${TARGET}/debug
    - cd ${TARGET}/debug
    - cmake -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=../../toolchains/RaspberryPi.cmake -DSIMULANT_BUILD_SAMPLES=OFF -DSIMULANT_BUILD_C_BINDINGS=ON ../..
    - make -j3
    - cd ../..
    - mkdir -p ${TARGET}/release
    - cd ${TARGET}/release
