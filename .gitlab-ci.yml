.deploy:deploy:
  stage: deploy
  only:
    - main
    - legacy
    - next
    - tags
  variables:
    LIB_EXT: a
  image: $CI_REGISTRY_IMAGE:deploy
  script:
    - mkdir -p ./upload/${TARGET}/lib
    - mkdir -p ./upload/${TARGET}/lib/debug
    - mkdir -p ./upload/${TARGET}/lib/release
    - mkdir -p ./upload/${TARGET}/include/simulant
    - mkdir -p ./upload/${TARGET}/include/vapi
    - mkdir -p ./upload/${TARGET}/include/glib-vendor
    - cp ${TARGET}/release/simulant/*.${LIB_EXT} ./upload/${TARGET}/lib/release/
    - cp ${TARGET}/debug/simulant/*.${LIB_EXT} ./upload/${TARGET}/lib/debug/
    # libsimulant-c and libsimulant-vala are always static (.a), regardless of LIB_EXT,
    # and are only produced where SIMULANT_BUILD_C_BINDINGS/valac are available, so these
    # are best-effort copies.
    - cp ${TARGET}/release/ports/c/*.a ./upload/${TARGET}/lib/release/ 2>/dev/null || true
    - cp ${TARGET}/debug/ports/c/*.a ./upload/${TARGET}/lib/debug/ 2>/dev/null || true
    - cp ${TARGET}/release/ports/vala/*.a ./upload/${TARGET}/lib/release/ 2>/dev/null || true
    - cp ${TARGET}/debug/ports/vala/*.a ./upload/${TARGET}/lib/debug/ 2>/dev/null || true
    # libsimulant-vala.a's PUBLIC link interface requires glib/gobject (and
    # their own pcre2/libffi/proxy-libintl deps) -- see cmake/BuildGLib.cmake
    # -- so these are bundled too, otherwise the package would be unusable
    # from Vala. Also best-effort: only present where simulant-vala built.
    - cp ${TARGET}/release/deps/glib-build/glib/*.a ./upload/${TARGET}/lib/release/ 2>/dev/null || true
    - cp ${TARGET}/debug/deps/glib-build/glib/*.a ./upload/${TARGET}/lib/debug/ 2>/dev/null || true
    - cp ${TARGET}/release/deps/glib-build/gobject/*.a ./upload/${TARGET}/lib/release/ 2>/dev/null || true
    - cp ${TARGET}/debug/deps/glib-build/gobject/*.a ./upload/${TARGET}/lib/debug/ 2>/dev/null || true
    - cp ${TARGET}/release/deps/glib-build/subprojects/pcre2-*/libpcre2-8.a ./upload/${TARGET}/lib/release/ 2>/dev/null || true
    - cp ${TARGET}/debug/deps/glib-build/subprojects/pcre2-*/libpcre2-8.a ./upload/${TARGET}/lib/debug/ 2>/dev/null || true
    - cp ${TARGET}/release/deps/glib-build/subprojects/libffi-*/src/libffi.a ./upload/${TARGET}/lib/release/ 2>/dev/null || true
    - cp ${TARGET}/debug/deps/glib-build/subprojects/libffi-*/src/libffi.a ./upload/${TARGET}/lib/debug/ 2>/dev/null || true
    - cp ${TARGET}/release/deps/glib-build/subprojects/proxy-libintl-*/libintl.a ./upload/${TARGET}/lib/release/ 2>/dev/null || true
    - cp ${TARGET}/debug/deps/glib-build/subprojects/proxy-libintl-*/libintl.a ./upload/${TARGET}/lib/debug/ 2>/dev/null || true
    # Android builds several ABIs at once and collects them into abi/<abi>/
    # (see .build:android); every other target is a single architecture and
    # has no abi/ directory at all, so this is a no-op there.
    - cp -r ${TARGET}/release/abi/. ./upload/${TARGET}/lib/release/ 2>/dev/null || true
    - cp -r ${TARGET}/debug/abi/. ./upload/${TARGET}/lib/debug/ 2>/dev/null || true
    - rsync -avm -L --include='*.h' --include='*.hpp' --include='*.inc' -f 'hide,! */' simulant ./upload/${TARGET}/include
    - rsync -avm -L --include='*.h' --include='*.hpp' --include='*.inc' -f 'hide,! */' ports/c/generated/include/simulant ./upload/${TARGET}/include
    - rsync -avm -L --include='*.h' --include='*.hpp' --include='*.inc' -f 'hide,! */' ports/c/include/simulant ./upload/${TARGET}/include
    - cp ports/vala/*.vapi ./upload/${TARGET}/include/vapi/
    - cp ${TARGET}/release/ports/vala/simulant-vala.vapi ./upload/${TARGET}/include/vapi/ 2>/dev/null || true
    - cp ${TARGET}/release/ports/vala/simulant-vala.h ./upload/${TARGET}/include/vapi/ 2>/dev/null || true
    # Mirrors deps/glib's own layout (glib/, gobject/ subdirs) merged with
    # the platform's build-generated headers (glibconfig.h, glib-enumtypes.h,
    # gversionmacros.h, glib-visibility.h, gobject-visibility.h, ...) so a
    # consumer's include path is just include/glib-vendor(/glib|/gobject).
    - rsync -avm -L --include='*.h' -f 'hide,! */' deps/glib/glib ./upload/${TARGET}/include/glib-vendor/
    - rsync -avm -L --include='*.h' -f 'hide,! */' deps/glib/gobject ./upload/${TARGET}/include/glib-vendor/
    - cp ${TARGET}/release/deps/glib-build/glib/*.h ./upload/${TARGET}/include/glib-vendor/glib/ 2>/dev/null || true
    - cp ${TARGET}/release/deps/glib-build/gobject/*.h ./upload/${TARGET}/include/glib-vendor/gobject/ 2>/dev/null || true
    - cd upload
    - zip -r ${TARGET}.zip ${TARGET}/
    - echo -e "${GCS_ACCESS_KEY}\n${GCS_SECRET}\nsimulant-engine\n" | gsutil config -a
    - gsutil cp ${TARGET}.zip gs://staging.simulant-engine.appspot.com/${CI_COMMIT_REF_NAME}/
    - gsutil acl ch -u AllUsers:R gs://staging.simulant-engine.appspot.com/${CI_COMMIT_REF_NAME}/${TARGET}.zip
  artifacts:
    paths:
      - upload/${TARGET}.zip

